[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "apartmint"
version = "0.4.0"
description = "Local housing listing and price-change monitor"
requires-python = ">=3.11"
dependencies = ["celery[redis]>=5.4,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
apartmint = "apartmint.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/apartmint"]
